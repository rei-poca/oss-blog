<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('搜索')}"></head>
<body>
<header th:replace="~{layout :: nav}"></header>

<main class="container">
    <section class="hero">
        <h1 th:text="'搜索：' + ${q}">搜索</h1>
        <p th:text="'共找到 ' + ${#lists.size(results)} + ' 条结果'">结果</p>
    </section>

    <div class="filter-bar" th:if="${!tags.isEmpty()}">
        <a class="filter-link" th:classappend="${tag == null or tag == ''} ? 'active' : ''"
           th:href="@{/search(q=${q})}">全部</a>
        <a class="filter-link" th:each="t : ${tags}"
           th:classappend="${tag == t.slug} ? 'active' : ''"
           th:href="@{/search(q=${q}, tag=${t.slug})}" th:text="${t.name}">标签</a>
    </div>

    <div class="empty" th:if="${results.isEmpty()}">
        <p>没有找到与「<span th:text="${q}">关键词</span>」相关的文章，换个关键词试试吧。</p>
    </div>

    <div class="result-item" th:each="item : ${results}">
        <a class="result-title"
           th:href="@{/post/{slug}(slug=${item.post.slug})}"
           th:utext="${item.highlightedTitle}">标题</a>
        <div class="card-meta" style="margin: 8px 0;">
            <span th:text="${item.post.author.username}">作者</span> ·
            <span th:text="${#temporals.format(item.post.createdAt, 'yyyy-MM-dd')}">日期</span>
        </div>
        <p class="card-excerpt"
           th:utext="${item.highlightedExcerpt}">摘要</p>
        <div class="tag-list" th:if="${!item.post.tags.isEmpty()}">
            <a class="tag" th:each="t : ${item.post.tags}"
               th:href="@{/search(q=${q}, tag=${t.slug})}" th:text="${t.name}">标签</a>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
