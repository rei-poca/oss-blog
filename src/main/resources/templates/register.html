<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('注册')}"></head>
<body>
<header th:replace="~{layout :: nav}"></header>

<main class="container">
    <div class="auth-wrap">
        <div class="auth-card">
            <h1>注册</h1>
            <div class="alert alert-error" th:if="${registerError}" th:text="${registerError}">错误</div>
            <form th:action="@{/register}" method="post" th:object="${registrationForm}">
                <div class="field">
                    <label for="username">用户名</label>
                    <input id="username" type="text" th:field="*{username}">
                    <div class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">错误</div>
                </div>
                <div class="field">
                    <label for="email">邮箱</label>
                    <input id="email" type="email" th:field="*{email}">
                    <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">错误</div>
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input id="password" type="password" th:field="*{password}">
                    <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">错误</div>
                </div>
                <div class="field">
                    <label for="confirmPassword">确认密码</label>
                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}">
                    <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">错误</div>
                </div>
                <button class="btn btn-block" type="submit">注册</button>
            </form>
            <p style="text-align: center; margin-top: 16px; font-size: 14px;">
                已有账号？<a th:href="@{/login}">去登录</a>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
